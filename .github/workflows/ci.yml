name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and repository safety
        run: bash scripts/check.sh
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Require committed dependency lock
        run: git ls-files --error-unmatch flake.lock
      - name: Enable KVM for disposable VM checks
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Evaluate and check flake
        run: nix flake check --no-update-lock-file --show-trace --print-build-logs
      - name: Collect installer VM failure log
        if: failure()
        run: |
          drv=$(nix eval --no-update-lock-file --raw .#checks.x86_64-linux.installer-e2e.drvPath) || exit 0
          nix log "$drv" > installer-e2e.log 2>&1 || true
          tail -n 300 installer-e2e.log
      - name: Upload VM diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-e2e-log
          path: installer-e2e.log
          if-no-files-found: ignore
      - name: Evaluate full NixOS configuration
        run: nix eval --no-update-lock-file .#nixosConfigurations.ci.config.system.build.toplevel.drvPath --show-trace
      - name: Build installer
        run: nix build --no-update-lock-file .#packages.x86_64-linux.default --print-build-logs
  required:
    if: ${{ always() }}
    needs: [static, nix]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both checks
        env:
          STATIC: ${{ needs.static.result }}
          NIX: ${{ needs.nix.result }}
        run: test "$STATIC" = success && test "$NIX" = success
