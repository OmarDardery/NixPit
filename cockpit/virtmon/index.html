<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>NixPit Virtualization Monitor</title>
  <script src="../base1/cockpit.js"></script>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5L15 14H1L8 1.5z"/></svg>
        </span>
        <span>Virtualization Monitor</span>
        <span id="mod-badge" class="pill"><span class="dot"></span>Checking</span>
        <span id="cpu-badge" class="pill"><span class="dot"></span>CPU</span>
      </div>
      <div class="row">
        <button id="btn-load-mod" class="primary" style="display: none;">Load Module</button>
        <button id="btn-probe">Probe</button>
        <button id="btn-clear" class="danger">Clear</button>
        <button id="btn-live" class="success">Live (2s)</button>
        <button id="btn-refresh">Refresh</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="error-banner" class="alert-err"></div>

    <div class="bento-metrics">
      <div class="bento-cell"><div class="bento-label">Total Events</div><div class="bento-val" id="m-total">0</div></div>
      <div class="bento-cell"><div class="bento-label">KVM / Devices</div><div class="bento-val" id="m-kvm">0</div></div>
      <div class="bento-cell"><div class="bento-label">Kernel Modules</div><div class="bento-val" id="m-module">0</div></div>
      <div class="bento-cell"><div class="bento-label">Virt Network</div><div class="bento-val" id="m-network">0</div></div>
      <div class="bento-cell"><div class="bento-label">Virt Processes</div><div class="bento-val" id="m-process">0</div></div>
      <div class="bento-cell"><div class="bento-label">Ring Buffer</div><div class="bento-val" id="m-ring">0 / 512</div></div>
    </div>

    <div class="card">
      <div class="row between" style="margin-bottom: 0.55rem;">
        <span class="muted">Active Probes &amp; Kernel Modules</span>
        <span id="ring-info" class="muted mono">Ring: 0/512</span>
      </div>
      <div id="probe-strip" class="row" style="margin-bottom: 0.5rem;"></div>
      <div id="loaded-mods" class="row"></div>
    </div>

    <div class="card">
      <div class="row between" style="margin-bottom: 0.75rem;">
        <div class="row">
          <div class="seg" id="source-seg">
            <button data-src="ring" class="active">Kernel Ring</button>
            <button data-src="dmesg">Kernel Journal</button>
            <button data-src="services">Libvirt Units</button>
          </div>
          <div class="seg" id="cat-filters">
            <button data-cat="all" class="active">All</button>
            <button data-cat="kvm">kvm</button>
            <button data-cat="module">module</button>
            <button data-cat="network">network</button>
            <button data-cat="process">process</button>
            <button data-cat="system">system</button>
          </div>
        </div>
        <div class="row">
          <input id="search-input" placeholder="Filter message, comm, PID..." size="22" />
          <button id="btn-export">Export</button>
        </div>
      </div>

      <div id="ring-view" class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Seq</th>
              <th>Timestamp (UTC)</th>
              <th>Category</th>
              <th>Level</th>
              <th>PID</th>
              <th>Process</th>
              <th>Message</th>
            </tr>
          </thead>
          <tbody id="events-body">
            <tr><td colspan="7" class="muted">Loading kernel events...</td></tr>
          </tbody>
        </table>
      </div>

      <pre id="raw-log-view" style="display: none; height: 460px;"></pre>
    </div>
  </main>

  <div id="toasts" class="toast-wrap"></div>
  <script src="app.js"></script>
</body>
</html>
